# Cloud Run environment configuration for U2U backend in demo mode.
# Passed to gcloud run deploy via --env-vars-file to safely preserve comma-separated origins/allowlists.
# Contains zero secrets (secrets are injected via Secret Manager --set-secrets).

DATA_MODE: "demo"
FIRESTORE_DB: "u2u-demo"
STORE: "firestore"
GOOGLE_CLOUD_PROJECT: "uyir2uyir"
VERTEX_LOCATION: "asia-south1"
GEMINI_MODEL: "gemini-2.0-flash"
ALLOWED_ORIGINS: "http://localhost:5173,https://uyir2uyir.web.app,https://uyir2uyir.firebaseapp.com"
PUBLIC_BASE_URL: "https://u2u-api-demo.a.run.app"
SCHEDULER_SERVICE_ACCOUNT: "sa-scheduler@uyir2uyir.iam.gserviceaccount.com"
CALL_ALLOWLIST: "+919876543210,+919876543211"
DAILY_CALL_CAP: "30"
REQUEST_CALL_CAP: "15"
DAILY_GEMINI_CAP: "2000"
