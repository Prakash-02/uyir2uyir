# Cloud Run environment configuration for U2U backend in demo mode.
# Passed to gcloud run deploy via --env-vars-file to preserve comma-separated origins/allowlists.
# Contains ZERO secrets (secrets are managed via Secret Manager and --set-secrets).

DATA_MODE: "demo"
STORE: "firestore"
FIRESTORE_DB: "u2u-demo"
GOOGLE_CLOUD_PROJECT: "uyir2uyir-53929"
VERTEX_LOCATION: "asia-south1"

# NOTE: Fill with your preferred Gemini model name (e.g. gemini-2.0-flash) before deploying
GEMINI_MODEL: "YOUR_GEMINI_MODEL_HERE"

ALLOWED_ORIGINS: "https://uyir2uyir-53929.web.app,https://uyir2uyir-53929.firebaseapp.com,http://localhost:5173"

# NOTE: Fill with your actual Cloud Run service URL after the first deploy, then redeploy once
PUBLIC_BASE_URL: "REPLACE_WITH_SERVICE_URL_AFTER_DEPLOY"

SCHEDULER_SERVICE_ACCOUNT: "sa-scheduler@uyir2uyir-53929.iam.gserviceaccount.com"
CALL_ALLOWLIST: "+919876543210,+919876543211"
DAILY_CALL_CAP: "30"
REQUEST_CALL_CAP: "15"
DAILY_GEMINI_CAP: "2000"
